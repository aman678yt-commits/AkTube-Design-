<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkTube Design</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0a0a0a, #1e1e1e);
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      padding: 50px 20px;
      background: #111;
    }
    h1 {
      font-size: 2.5em;
      color: #00eaff;
    }
    p {
      font-size: 1.1em;
      color: #ddd;
      margin-top: 10px;
    }
    .buttons {
      margin-top: 30px;
    }
    .buttons a {
      text-decoration: none;
      color: white;
      background: #00eaff;
      padding: 12px 25px;
      border-radius: 8px;
      margin: 10px;
      display: inline-block;
      font-weight: bold;
    }
    .buttons a:hover {
      background: #0095ff;
    }
    footer {
      margin-top: 50px;
      padding: 15px;
      background: #111;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <h1>AkTube Design</h1>
    <p>AI Tools • Tech Content • Thumbnail Design</p>
  </header>

  <div class="buttons">
    <a href="#">AI Tools</a>
    <a href="#">Tech Content</a>
    <a href="#">Contact</a>
  </div>

  <footer>
    <p>© 2025 AkTube Design | Created with ❤️ by Aman</p>
  </footer>

</body>
  </html>
